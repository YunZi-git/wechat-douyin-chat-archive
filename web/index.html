<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聊天信息工作台</title>
    <script>
      // 首屏防闪：把上次使用的外观直接贴成 CSS 变量（与 lib/themes.js 等价）
      ;(function () {
        try {
          var raw = localStorage.getItem('chatwork.palette')
          if (!raw) return
          var t = JSON.parse(raw)
          if (!t || !t.palette) return
          var p = t.palette
          var s = t.shape || {}
          var radius = s.radius == null ? 12 : s.radius
          function lum(hex) {
            var m = /^#([0-9a-f]{6})$/i.exec(hex || '')
            if (!m) return 1
            var n = parseInt(m[1], 16)
            var c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) {
              var x = v / 255
              return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4)
            })
            return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]
          }
          var vars = {
            '--bg': p.bg,
            '--bg-rail': p.bgRail || p.bg,
            '--panel': p.panel,
            '--panel-2': p.panel2,
            '--panel-3': p.panel3,
            '--border': p.border,
            '--border-soft': p.borderSoft,
            '--text': p.text,
            '--text-dim': p.textDim,
            '--text-faint': p.textFaint,
            '--accent': p.accent,
            '--accent-soft': p.accentSoft,
            '--shadow': p.shadow || 'none',
            '--shadow-sm': (p.shadow && p.shadow !== 'none')
              ? (t.dark ? '0 6px 18px rgba(0, 0, 0, 0.26)' : '0 6px 18px rgba(23, 32, 55, 0.10)')
              : 'none',
            '--shadow-control': (t.source !== 'builtin' && p.shadow && p.shadow !== 'none') ? p.shadow : 'none',
            '--on-accent': lum(p.accent) > 0.56 ? '#0b0d12' : '#ffffff',
            '--radius': radius + 'px',
            '--radius-lg': (radius ? radius + 4 : 0) + 'px',
            '--radius-sm': Math.max(0, radius - 4) + 'px',
            '--radius-pill': radius > 0 ? '999px' : '0px',
            '--radius-bubble': (radius === 0 ? 0 : Math.min(18, radius + 2)) + 'px',
            '--border-w': (s.borderWidth == null ? 1 : s.borderWidth) + 'px',
          }
          var style = document.documentElement.style
          for (var k in vars) if (vars[k]) style.setProperty(k, vars[k])
          document.documentElement.setAttribute('data-theme', 'custom')
          style.colorScheme = t.dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
